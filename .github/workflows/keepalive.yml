# Supabase free-tier pauses DB after ~7 days of inactivity.
# Pings the combined keepalive + newsletter drain endpoint every 12 hours.
# Also processes newsletter queue (up to BATCH_SIZE emails per call).
name: Keepalive + Newsletter Drain
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping combined endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sagarlad.com/api/cron/keepalive" || true
